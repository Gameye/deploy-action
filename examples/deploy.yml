# Build the server image, push it to GHCR, register it with Gameye and smoke-test it.
name: Deploy game server

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Choose the image name and tag
        id: image
        shell: bash
        run: |
          # Docker image names must be lowercase; GitHub owners may not be.
          echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/my-game-server" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          push: true
          platforms: linux/amd64
          tags: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}

      - uses: gameye/deploy-action@v0
        with:
          api-token: ${{ secrets.GAMEYE_API_TOKEN }}
          application: my-game-server
          tag: ${{ steps.image.outputs.tag }}
          region: europe, us-east
          github-deployment: gameye-sandbox
          smoke-test: true
          smoke-duration: 60s
          smoke-args: |
            --map=test
